[project]
name = "amplifier-module-hooks-streaming-ui"
version = "1.0.0"
description = "Streaming UI display hooks for Amplifier - displays thinking blocks and tool invocations to console"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
]

[project.entry-points."amplifier.modules"]
hooks-streaming-ui = "amplifier_module_hooks_streaming_ui:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "amplifier-core>=1.0.10",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "strict"

